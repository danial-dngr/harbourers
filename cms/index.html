<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARBOURERS CMS / MODULAR</title>
<link rel="stylesheet" href="cms.css">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>
<header>
  <strong>HARBOURERS CMS / MODULAR PROJECTS</strong>
  <div class="header-actions">
    <button id="loadSiteBtn">RELOAD SITE</button>
    <button id="exportProjectBtn" class="primary">EXPORT CURRENT PROJECT</button>
    <button id="exportIndexBtn">EXPORT PROJECT INDEX</button>
  </div>
</header>

<div id="statusBar" class="status">Loading projects from the site…</div>

<div class="shell">
  <aside>
    <button id="newProject">+ NEW PROJECT</button>
    <p class="hint">PROJECT ORDER</p>
    <div id="projects"></div>
    <div class="aside-note">
      <strong>NORMAL EDIT:</strong><br>
      Export only the current project.<br><br>
      <strong>NEW / DELETE / REORDER / SLUG CHANGE:</strong><br>
      Export the project index too.
    </div>
  </aside>

  <main>
    <section id="editor"></section>
    <section class="previewPane">
      <div class="previewHead">
        <strong>LIVE PROJECT PREVIEW</strong>
        <button id="desktopBtn" class="active">DESKTOP</button>
        <button id="mobileBtn">MOBILE</button>
      </div>
      <div id="previewViewport"><div id="projectPreview"></div></div>
    </section>
  </main>
</div>
<script src="cms.js"></script>
</body>
</html>
