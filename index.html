    <div class="centre-text-reel-track" id="centreTextReelTrack"></div>
  </div>

  <div class="grid-container" id="gridContainer" aria-live="polite"></div>

  <div class="mobile-stack-container" id="mobileStackContainer" aria-live="polite"></div>

  <div class="content">
    <div class="menu-heading-row">
      <h4 id="projectMenuHeading">PROJECTS</h4>
      <button class="close-all-button" id="closeAllBtn" type="button" title="Close all projects" aria-label="Close all projects"></button>
    </div>
    <ul id="projectList">
      <!-- populated from content/projects.json -->
    </ul>

    <div class="site-note" aria-label="Copyright notice">
      
      © HARBOURERS <span id="copyrightYear"></span><br>
      ALL RIGHTS RESERVED<br>
      NO AI TRAINING OR DATA COLLECTION
    </div>

    <!-- Footer info moved into menu -->
    <div class="info-bar" id="infoBar">
      
      <div class="info-cell">HARBOURER</div>
      <div class="info-cell">DANIAL GRAHAM</div>
      <div class="info-cell">VISUAL SERVICES STUDIO</div>
      <div class="info-cell"><a href="mailto:danial@dngrgoods.com">DANIAL@DNGRGOODS.COM</a></div>
      
  </div>

  <div class="three-container"></div>

  <!-- SECTION 12: Contact / Draw System -->
  <section class="contact-overlay" id="contactPanel" aria-label="Contact DNGR GOODS">
    <div class="contact-window">
      <div class="contact-header">
        <h3>REACH OUT &/OR SEND US A DRAWING</h3>
        <button class="contact-close-x" id="closeContactBtn" type="button" title="Close contact panel"></button>
      </div>


      <div class="draw-toolbar">
        <button class="draw-tool active" data-tool="pen" type="button">PEN</button>
        <button class="draw-tool" data-tool="eraser" type="button">ERASER</button>
        <button class="draw-tool" data-tool="fill" type="button">FILL</button>
        <button id="undoDrawingBtn" type="button">UNDO</button>
        <button id="redoDrawingBtn" type="button">REDO</button>
        <button id="clearDrawingBtn" type="button">CLEAR</button>
        <button id="downloadDrawingBtn" type="button">SAVE PNG</button>
      </div>

      <div class="colour-row" id="colourRow" aria-label="Drawing colours">
        <button class="colour-swatch active" data-colour="#111111" style="--swatch:#111111" title="Ink Black"></button>
        <button class="colour-swatch" data-colour="#b45a50" style="--swatch:#b45a50" title="Dusty Red"></button>
        <button class="colour-swatch" data-colour="#d4b83f" style="--swatch:#d4b83f" title="Muted Yellow"></button>
        <button class="colour-swatch" data-colour="#6f8f4e" style="--swatch:#6f8f4e" title="Olive"></button>
        <button class="colour-swatch" data-colour="#87CEEB" style="--swatch:#87CEEB" title="Dusty Blue"></button>
        <button class="colour-swatch" data-colour="#f0eadf" style="--swatch:#f0eadf" title="Off White"></button>
      </div>

      <div class="canvas-wrap">
        <canvas id="contactCanvas" width="900" height="560"></canvas>
        <div class="drawing-caption-preview" id="drawingCaptionPreview"></div>
      </div>
      <div class="contact-form-grid">
          <input id="drawingCaption" maxlength="90" placeholder="NAME YOUR ARTWORK" />
        <input id="contactName" placeholder="YOUR NAME" autocomplete="name" />
        <input id="contactEmail" placeholder="EMAIL" autocomplete="email" />
      </div>
       <textarea id="contactMessage" placeholder="MESSAGE"></textarea>

<button id="sendContactBtn" type="button">
  SEND
</button>

      <div class="contact-status" id="contactStatus"></div>
    </div>
  </section>


  
  <script src="js/app.js"></script>
